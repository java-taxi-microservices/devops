services:
  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka
    restart: unless-stopped
    hostname: kafka
    ports:
      - "29094:29094"
    env_file:
      - .env
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Kraft Mode
      KAFKA_NODE_ID: 1
      CLUSTER_ID: MkQkSWJHUkVGS3hJcWZNeA==
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: BROKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,CLIENT://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:29092,CLIENT://kafka:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SSL,BROKER:SSL,CLIENT:SASL_SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER

      # SASL/SCRAM
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-256

      # SSL/TLS Configuration (global)
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.server.keystore.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      KAFKA_SSL_KEY_PASSWORD: ${KEYSTORE_PASSWORD}
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.p12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: HTTPS
      KAFKA_SSL_CLIENT_AUTH: none

      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/kafka_jaas.conf

    healthcheck:
      test: [ "CMD-SHELL", "echo | openssl s_client -connect localhost:29094 -CAfile /etc/kafka/secrets/ca-cert.pem -verify_return_error 2>/dev/null | grep -q 'Verify return code: 0'" ]
      interval: 10s
      timeout: 5s
      retries: 10

    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./secrets:/etc/kafka/secrets:ro
      - ./secrets/kafka_jaas.conf:/etc/kafka/kafka_jaas.conf:ro

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-users-init:
        condition: service_completed_successfully
    ports:
      - "8280:8080"
    environment:
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USERNAME}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD}
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29094
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: SCRAM-SHA-256
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username=admin password=${KAFKA_ADMIN_PASSWORD};
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /opt/certs/kafka.truststore.p12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12

    volumes:
      - ./secrets:/opt/certs:ro
    env_file:
      - .env

  kafka-users-init:
    image: confluentinc/cp-kafka:7.5.1
    container_name: kafka-users-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./secrets:/etc/kafka/secrets:ro
    entrypoint: ["/bin/bash"]
    command:
      - -ec
      - >-
        kafka-configs --bootstrap-server kafka:29092 --command-config
        /etc/kafka/secrets/ssl.properties --alter --entity-type users
        --entity-name admin --add-config
        "SCRAM-SHA-256=[iterations=8192,password=$$KAFKA_ADMIN_PASSWORD]"
        && kafka-configs --bootstrap-server kafka:29092 --command-config
        /etc/kafka/secrets/ssl.properties --alter --entity-type users
        --entity-name client --add-config
        "SCRAM-SHA-256=[iterations=8192,password=$$KAFKA_CLIENT_PASSWORD]"

volumes:
  kafka-data:
